<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDR Agent Lab</title>
  <meta name="description" content="An agentic SDR workflow you can watch: memory, scoped tools, guardrails, traces and evals.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2317150F'/%3E%3Cpath d='M3 11h3l2-6 2 6h3' stroke='%23D9472B' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="wordmark" href="#/leads" aria-label="SDR Agent Lab home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16h4l3-9 3 9h4l2-4h2"/></svg>
        <span>SDR Agent Lab</span>
      </a>
      <div class="model" id="model" aria-live="polite"></div>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch light or dark theme">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="M8 3v10" /><path d="M8 3a5 5 0 0 1 0 10z" class="fill"/></svg>
      </button>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#/leads" data-tab="leads">Leads</a>
      <a href="#/review" data-tab="review">Review <span class="count" id="pending-count" hidden></span></a>
      <a href="#/runs" data-tab="runs">Runs</a>
      <a href="#/evals" data-tab="evals">Evals</a>
      <a href="#/memory" data-tab="memory">Memory</a>
      <a href="#/how" data-tab="how">How it works</a>
    </nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="colophon">
    Fictional leads and companies. Nothing is ever sent: every email waits for a human.
    <a href="https://github.com/abeni-al7/sdr-agent-lab">Source on GitHub</a>
  </footer>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
